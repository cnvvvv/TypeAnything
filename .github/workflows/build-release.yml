name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BOOST_VERSION: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\third_party\weasel\deps\boost_1_84_0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-1_84_0-msvc14.3-x64

      - name: CI Setup (librime + boost + data)
        shell: pwsh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\ci_setup.ps1

      - name: Build librime (deps + rime.dll)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd third_party\weasel
          python run_via_python.py

      - name: Publish librime build diagnostics
        if: failure()
        shell: pwsh
        run: |
          # Emit librime build logs as a check annotation (publicly readable
          # via the check-runs annotations API) + write step summary.
          $files = @(
            'third_party\weasel\_log_librime_deps.txt',
            'third_party\weasel\_log_librime.txt'
          )
          $sb = [System.Text.StringBuilder]::new()
          foreach ($f in $files) {
            [void]$sb.AppendLine("===== $f =====")
            if (Test-Path $f) {
              $fi = Get-Item $f
              [void]$sb.AppendLine("(size: $($fi.Length) bytes)")
              $errLines = @(Select-String -Path $f -Pattern 'error|fatal|FAILED|LNK[0-9]{4}|C[0-9]{4}|undefined' -ErrorAction SilentlyContinue | Select-Object -Last 25 | ForEach-Object { $_.Line })
              if ($errLines.Count -gt 0) {
                [void]$sb.AppendLine("--- error lines ---")
                [void]$sb.AppendLine(($errLines -join "`n"))
              }
              $lines = @(Get-Content $f -ErrorAction SilentlyContinue)
              $lines = $lines | Select-Object -Last 150
              [void]$sb.AppendLine("--- last lines ---")
              [void]$sb.AppendLine(($lines -join "`n"))
            } else {
              [void]$sb.AppendLine("(file not found)")
            }
          }
          [void]$sb.AppendLine("===== librime/env.bat =====")
          $envBat = 'third_party\weasel\librime\env.bat'
          if (Test-Path $envBat) {
            [void]$sb.AppendLine((Get-Content $envBat -Raw))
          } else {
            [void]$sb.AppendLine("(env.bat not found)")
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $sb.ToString()
          $msg = $sb.ToString()
          if ($msg.Length -gt 60000) { $msg = $msg.Substring($msg.Length - 60000) }
          $escaped = $msg -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
          Write-Output "::error title=librime build diagnostics::$escaped"
          Write-Host "librime diagnostics published as annotation"

      - name: Upload librime diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: librime-build-diagnostics
          path: |
            third_party/weasel/_log_librime_deps.txt
            third_party/weasel/_log_librime.txt
            third_party/weasel/librime/env.bat
          if-no-files-found: ignore

      - name: Build Weasel UI (TSF + Server + Deployer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd third_party\weasel
          python run_build_weasel.py

      - name: Build ta-settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd tools\ta-settings
          .\_build.ps1

      - name: Build ta-installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd tools\ta-installer
          .\_build.ps1

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $exe = "tools\ta-installer\build\windows\x64\release\ta-installer.exe"
          if (Test-Path $exe) {
            $f = Get-Item $exe
            Write-Host "Installer: $($f.FullName) ($($f.Length) bytes)"
          } else {
            throw "Installer not found: $exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeAnything-installer
          path: tools/ta-installer/build/windows/x64/release/ta-installer.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/ta-installer/build/windows/x64/release/ta-installer.exe
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
